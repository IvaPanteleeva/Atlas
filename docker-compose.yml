services:
  atlas-db:
    image: postgres:18-alpine
    container_name: atlas-db
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images expect the volume at /var/lib/postgresql (data goes in a versioned subfolder).
      - atlas-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atlas-db-data:
    # Explicit name: the Cyrillic folder name gives Compose an empty project name.
    name: atlas-db-data

networks:
  default:
    name: atlas-network
