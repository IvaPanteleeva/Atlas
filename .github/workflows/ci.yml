name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: "false"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Writes into src/Atlas.Api/wwwroot (git-ignored), served by the API.
      - name: Build web
        working-directory: web
        run: npx ng build

      - name: Test web
        working-directory: web
        run: npx ng test --watch=false

      - name: Build .NET
        run: dotnet build Atlas.slnx -c Release

      # Integration tests start a Postgres container with Testcontainers; ubuntu runners have Docker.
      - name: Test .NET
        run: dotnet test Atlas.slnx -c Release --no-build
