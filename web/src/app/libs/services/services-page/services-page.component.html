<div class="sec-head">
    <h1>Услуги</h1>
    @if (auth.isStaff()) {
        <button nz-button nzType="primary" type="button" (click)="openForm(null)">
            <nz-icon nzType="plus" nzTheme="outline" aria-hidden="true" />
            Нова услуга
        </button>
    }
</div>
<p class="intro">Общият списък с работи. Цените за конкретен обект се задават в обекта.</p>

@if (!formOpen() && store.error(); as message) {
    <nz-alert class="error" nzType="error" [nzMessage]="message" nzShowIcon role="alert" />
}

@if (store.loading() && !store.services().length) {
    <p class="note">Зареждане…</p>
} @else {
    <atlas-service-list [services]="store.services()" [canEdit]="auth.isStaff()" (open)="openForm($event)" />
}

<nz-modal
    [nzVisible]="formOpen()"
    [nzTitle]="editing() ? 'Услуга' : 'Нова услуга'"
    [nzFooter]="null"
    nzWrapClassName="atlas-sheet"
    nzCentered
    [nzWidth]="560"
    [nzMaskClosable]="false"
    (nzOnCancel)="closeForm()"
>
    <ng-container *nzModalContent>
        <atlas-service-form
            [service]="editing()"
            [canDelete]="auth.isOwner()"
            [saving]="store.saving()"
            [error]="store.error()"
            [fieldErrors]="store.fieldErrors()"
            (save)="save($event)"
            (delete)="remove()"
            (cancel)="closeForm()"
        />
    </ng-container>
</nz-modal>
