<form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <nz-form-item>
        <nz-form-label nzFor="new-password" nzRequired>Нова парола</nz-form-label>
        <nz-form-control nzErrorTip="Поне 8 знака">
            <nz-input-password [nzVisible]="passwordVisible()" [nzVisibilityToggle]="false">
                <input nz-input id="new-password" formControlName="password" autocomplete="new-password" />
                <button
                    nzInputSuffix
                    type="button"
                    class="eye"
                    [attr.aria-label]="passwordVisible() ? 'Скрий паролата' : 'Покажи паролата'"
                    [attr.aria-pressed]="passwordVisible()"
                    (click)="togglePassword()"
                >
                    <nz-icon [nzType]="passwordVisible() ? 'eye' : 'eye-invisible'" nzTheme="outline" />
                </button>
            </nz-input-password>
            @if (fieldErrors()['password']; as message) {
                <div class="server-error">{{ message }}</div>
            }
        </nz-form-control>
    </nz-form-item>

    @if (error(); as message) {
        <nz-alert class="error" nzType="error" nzShowIcon role="alert" [nzMessage]="message" />
    }

    <div class="footer">
        <button nz-button type="button" [disabled]="saving()" (click)="cancel.emit()">Отказ</button>
        <button nz-button nzType="primary" type="submit" [nzLoading]="saving()">Запази</button>
    </div>
</form>
