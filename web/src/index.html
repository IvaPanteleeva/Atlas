<!doctype html>
<html lang="bg">
    <head>
        <meta charset="utf-8" />
        <title>Атлас</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <style>
            /* Startup loader while the app asks GET /api/auth/me; Angular replaces it with the first page. */
            .boot {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #141310;
                color: #e09a12;
                font-family: 'Oswald', 'Arial Narrow', sans-serif;
                font-size: 32px;
                font-weight: 600;
                letter-spacing: 0.08em;
            }
            .boot span {
                animation: boot-pulse 1.2s ease-in-out infinite;
            }
            @keyframes boot-pulse {
                50% {
                    opacity: 0.4;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .boot span {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <atlas-root>
            <div class="boot" role="status" aria-label="Зареждане"><span>АТЛАС</span></div>
        </atlas-root>
    </body>
</html>
